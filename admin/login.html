<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Login - Transient House</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
      body { margin: 0; font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, 'Helvetica Neue', Arial; }
      .login-wrapper {
        min-height: 100vh;
        background: linear-gradient(135deg, #6B2A27 0%, #96423B 100%);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .login-card {
        background: white;
        border-radius: 16px;
        box-shadow: 0 20px 60px rgba(150, 66, 59, 0.18);
        width: 100%;
        max-width: 420px;
        padding: 40px;
      }
      .login-header {
        text-align: center;
        margin-bottom: 30px;
      }
      .login-icon {
        width: 60px;
        height: 60px;
        background: linear-gradient(135deg, #6B2A27, #96423B);
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 30px;
        margin: 0 auto 16px;
      }
      .login-title {
        font-size: 24px;
        font-weight: 700;
        color: #1E1E1E;
        margin: 0 0 8px;
      }
      .login-subtitle {
        color: #6c757d;
        font-size: 14px;
      }
      .form-group {
        margin-bottom: 18px;
      }
      .form-group label {
        font-weight: 500;
        color: #333;
        margin-bottom: 8px;
        display: block;
      }
      .form-control {
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 14px;
        transition: all 0.2s ease;
      }
      .form-control:focus {
        border-color: #96423B;
        box-shadow: 0 0 0 3px rgba(150, 66, 59, 0.12);
        outline: 0;
      }
      .login-btn {
        width: 100%;
        padding: 10px;
        border: 0;
        border-radius: 8px;
        background: linear-gradient(135deg, #6B2A27, #96423B);
        color: white;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 10px;
      }
      .login-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(150, 66, 59, 0.3);
      }
      .login-footer {
        text-align: center;
        margin-top: 20px;
        color: #6c757d;
        font-size: 13px;
      }
      .login-footer a {
        color: #12A8E0;
        text-decoration: none;
      }
      .alert-error {
        border-radius: 8px;
        background: #fff3cd;
        border: 1px solid #ffc107;
        color: #856404;
        padding: 10px 12px;
        font-size: 13px;
        margin-bottom: 16px;
        display: none;
      }
      .login-remember {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 18px;
        font-size: 13px;
      }
      .login-remember input { cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="login-wrapper">
      <div class="login-card">
        <div class="login-header">
          <div class="login-icon"><i class="fa fa-lock"></i></div>
          <h1 class="login-title">Admin Login</h1>
          <p class="login-subtitle">Transient House Management</p>
        </div>
        
        <div class="alert-error" id="errorMsg"></div>
        
        <form id="loginForm">
          <div class="form-group">
            <label for="username">Username</label>
            <input 
              type="text" 
              id="username" 
              class="form-control" 
              placeholder="Enter your username" 
              required
              autocomplete="username"
            >
          </div>
          
          <div class="form-group">
            <label for="password">Password</label>
            <input 
              type="password" 
              id="password" 
              class="form-control" 
              placeholder="Enter your password" 
              required
              autocomplete="current-password"
            >
          </div>
          
          <div class="login-remember">
            <input type="checkbox" id="remember" name="remember">
            <label for="remember" style="margin: 0; cursor: pointer;">Remember me</label>
          </div>
          
          <button type="submit" class="login-btn">Sign In</button>
        </form>
        
        <div class="login-footer">
          <a href="../index.html"><i class="fa fa-arrow-left"></i> Back to website</a>
        </div>
      </div>
    </div>
    
    <script>
      document.getElementById('loginForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const remember = document.getElementById('remember').checked;
        const errorMsg = document.getElementById('errorMsg');
        
        if (username === 'admin' && password === 'password') {
          localStorage.setItem('adminAuth', 'true');
          localStorage.setItem('adminUser', username);
          if (remember) {
            localStorage.setItem('adminRemember', 'true');
          }
          location.replace('index.html');
        } else {
          errorMsg.style.display = 'block';
          errorMsg.textContent = '❌ Invalid username or password.';
        }
      });
      
      if (localStorage.getItem('adminAuth') === 'true') {
        location.replace('index.html');
      }
    </script>
  </body>
</html>
