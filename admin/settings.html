<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Settings - Transient House Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="admin-shell d-flex">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-top px-3 py-4 text-white">
          <div class="brand d-flex align-items-center gap-2">
            <div class="brand-text">
              <div class="brand-title">TRANSIENT ADMIN</div>
              <div class="brand-subtitle">Management</div>
            </div>
          </div>
        </div>
        <nav class="nav flex-column px-2">
          <a href="index.html" class="nav-link" data-section="dashboard"><i class="fa fa-gauge me-2"></i>Dashboard</a>
          <a href="rooms.html" class="nav-link" data-section="rooms"><i class="fa fa-bed me-2"></i>Rooms</a>
          <a href="bookings.html" class="nav-link" data-section="bookings"><i class="fa fa-calendar-check me-2"></i>Bookings</a>
          <a href="admin-users.html" class="nav-link" data-section="users"><i class="fa fa-users me-2"></i>Admin Users</a>
          <a href="#" class="nav-link mt-auto text-danger" id="logoutBtn"><i class="fa fa-sign-out-alt me-2"></i>Logout</a>
        </nav>
      </aside>

      <div class="main flex-fill">
        <header class="topbar d-flex align-items-center justify-content-between px-3">
          <div class="d-flex align-items-center gap-3">
            <button class="btn btn-sm btn-toggle d-md-none" id="toggleSidebar"><i class="fa fa-bars"></i></button>
            <h5 class="mb-0 text-white header-title">Settings</h5>
          </div>
          <div class="d-flex align-items-center gap-2">
            <a class="btn btn-sm btn-main-site" href="../index.html">OPEN THE MAIN SITE</a>
            <div class="dropdown">
              <a class="d-flex align-items-center text-white text-decoration-none dropdown-toggle" href="#" data-bs-toggle="dropdown">
                <strong>Admin</strong>
              </a>
              <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-item" href="#" id="logoutMenu">Sign out</a></li>
              </ul>
            </div>
          </div>
        </header>

        <main class="content p-4">
          <h4 class="mb-3">Admin Settings</h4>

          <div class="row g-3">
            <div class="col-lg-6">
              <div class="card p-3">
                <h6 class="mb-3"><i class="fa fa-user-cog me-2 text-primary"></i>Profile Settings</h6>
                <div class="mb-3">
                  <label class="form-label">Admin Name</label>
                  <input id="adminNameInput" type="text" class="form-control" placeholder="Admin Name">
                </div>
                <div class="mb-3">
                  <label class="form-label">Admin Email</label>
                  <input id="adminEmailInput" type="email" class="form-control" placeholder="admin@example.com">
                </div>
                <button class="btn btn-primary btn-sm" id="saveProfileBtn"><i class="fa fa-save me-2"></i>Save Profile</button>
              </div>
            </div>

            <div class="col-lg-6">
              <div class="card p-3">
                <h6 class="mb-3"><i class="fa fa-headset me-2 text-primary"></i>Support Contact</h6>
                <div class="mb-3">
                  <label class="form-label">Support Phone</label>
                  <input id="supportPhoneInput" type="text" class="form-control" placeholder="09918500322">
                </div>
                <div class="mb-3">
                  <label class="form-label">Support Email</label>
                  <input id="supportEmailInput" type="email" class="form-control" placeholder="info@dredstransient.com">
                </div>
                <button class="btn btn-primary btn-sm" id="saveSupportBtn"><i class="fa fa-save me-2"></i>Save Support</button>
              </div>
            </div>

            <div class="col-12">
              <div class="card p-3">
                <h6 class="mb-3"><i class="fa fa-bell me-2 text-primary"></i>Booking Workflow</h6>
                <div class="form-check form-switch mb-3">
                  <input class="form-check-input" type="checkbox" id="autoConfirmInput">
                  <label class="form-check-label" for="autoConfirmInput">Auto-confirm new bookings</label>
                </div>
                <div class="mb-3">
                  <label class="form-label">Default Booking Note</label>
                  <textarea id="bookingNoteInput" class="form-control" rows="2" placeholder="Enter default booking note"></textarea>
                </div>
                <button class="btn btn-primary btn-sm" id="saveBookingWorkflowBtn"><i class="fa fa-save me-2"></i>Save Booking Settings</button>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const storageKey = 'dredsAdminSettings';
        const adminNameInput = document.getElementById('adminNameInput');
        const adminEmailInput = document.getElementById('adminEmailInput');
        const supportPhoneInput = document.getElementById('supportPhoneInput');
        const supportEmailInput = document.getElementById('supportEmailInput');
        const autoConfirmInput = document.getElementById('autoConfirmInput');
        const bookingNoteInput = document.getElementById('bookingNoteInput');
        const saveProfileBtn = document.getElementById('saveProfileBtn');
        const saveSupportBtn = document.getElementById('saveSupportBtn');
        const saveBookingWorkflowBtn = document.getElementById('saveBookingWorkflowBtn');

        const defaultSettings = {
          adminName: 'Admin',
          adminEmail: 'admin@dredstransient.com',
          supportPhone: '09918500322',
          supportEmail: 'info@dredstransient.com',
          autoConfirmBookings: false,
          bookingNote: 'Thank you for booking with us. We will confirm your stay shortly.'
        };

        const loadSettings = () => {
          const stored = localStorage.getItem(storageKey);
          if (!stored) return defaultSettings;
          try {
            return Object.assign({}, defaultSettings, JSON.parse(stored));
          } catch (error) {
            return defaultSettings;
          }
        };

        const saveSettings = (settings) => {
          localStorage.setItem(storageKey, JSON.stringify(settings));
        };

        let settings = loadSettings();

        const populateFields = () => {
          adminNameInput.value = settings.adminName;
          adminEmailInput.value = settings.adminEmail;
          supportPhoneInput.value = settings.supportPhone;
          supportEmailInput.value = settings.supportEmail;
          autoConfirmInput.checked = settings.autoConfirmBookings;
          bookingNoteInput.value = settings.bookingNote;
        };

        populateFields();

        saveProfileBtn.addEventListener('click', () => {
          settings.adminName = adminNameInput.value.trim() || settings.adminName;
          settings.adminEmail = adminEmailInput.value.trim() || settings.adminEmail;
          saveSettings(settings);
          alert('Profile settings saved.');
        });

        saveSupportBtn.addEventListener('click', () => {
          settings.supportPhone = supportPhoneInput.value.trim() || settings.supportPhone;
          settings.supportEmail = supportEmailInput.value.trim() || settings.supportEmail;
          saveSettings(settings);
          alert('Support settings saved.');
        });

        saveBookingWorkflowBtn.addEventListener('click', () => {
          settings.autoConfirmBookings = autoConfirmInput.checked;
          settings.bookingNote = bookingNoteInput.value.trim() || settings.bookingNote;
          saveSettings(settings);
          alert('Booking workflow settings saved.');
        });

        document.getElementById('toggleSidebar')?.addEventListener('click', () => {
          document.getElementById('sidebar').classList.toggle('open');
        });

        document.getElementById('logoutBtn')?.addEventListener('click', () => {
          localStorage.removeItem('adminAuth');
          localStorage.removeItem('adminUser');
          location.replace('../index.html');
        });

        document.getElementById('logoutMenu')?.addEventListener('click', () => {
          localStorage.removeItem('adminAuth');
          localStorage.removeItem('adminUser');
          location.replace('../index.html');
        });

        if (localStorage.getItem('adminAuth') !== 'true') {
          location.replace('login.html');
        }
      });
    </script>
  </body>
</html>
