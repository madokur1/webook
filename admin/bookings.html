<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bookings - Transient House Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="admin-shell d-flex">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-top px-3 py-4 text-white">
          <div class="brand d-flex align-items-center gap-2">
            <div class="brand-text">
              <div class="brand-title">TRANSIENT ADMIN</div>
              <div class="brand-subtitle">Management</div>
            </div>
          </div>
        </div>
        <nav class="nav flex-column px-2">
          <a href="index.html" class="nav-link" data-section="dashboard"><i class="fa fa-gauge me-2"></i>Dashboard</a>
          <a href="rooms.html" class="nav-link" data-section="rooms"><i class="fa fa-bed me-2"></i>Rooms</a>
          <a href="bookings.html" class="nav-link active" data-section="bookings"><i class="fa fa-calendar-check me-2"></i>Bookings</a>
          <a href="admin-users.html" class="nav-link" data-section="users"><i class="fa fa-users me-2"></i>Admin Users</a>
          <a href="#" class="nav-link mt-auto text-danger" id="logoutBtn"><i class="fa fa-sign-out-alt me-2"></i>Logout</a>
        </nav>
      </aside>

      <div class="main flex-fill">
        <header class="topbar d-flex align-items-center justify-content-between px-3">
          <div class="d-flex align-items-center gap-3">
            <button class="btn btn-sm btn-toggle d-md-none" id="toggleSidebar"><i class="fa fa-bars"></i></button>
            <h5 class="mb-0 text-white header-title">Bookings Management</h5>
          </div>
          <div class="d-flex align-items-center gap-2">
            <a class="btn btn-sm btn-main-site" href="../index.html">OPEN THE MAIN SITE</a>
            <div class="dropdown">
              <a class="d-flex align-items-center text-white text-decoration-none dropdown-toggle" href="#" data-bs-toggle="dropdown">
                <strong>Admin</strong>
              </a>
              <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-item" href="#" id="logoutMenu">Sign out</a></li>
              </ul>
            </div>
          </div>
        </header>

        <main class="content p-4">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
              <h4 class="mb-1">Bookings</h4>
              <p class="text-muted small mb-0">View, manage, and process reservations</p>
            </div>
            <div class="d-flex gap-2">
              <button class="btn btn-sm btn-primary" id="addBookingBtn"><i class="fa fa-plus me-1"></i> Add Booking</button>
              <select class="form-select form-select-sm" style="width: 140px;" id="bookingStatusFilter">
                <option value="All">All Status</option>
                <option value="Pending">Pending</option>
                <option value="Confirmed">Confirmed</option>
                <option value="Cancelled">Cancelled</option>
              </select>
            </div>
          </div>

          <div id="adminNotificationArea" class="admin-notification-area mb-3"></div>

          <div class="card p-3">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <input id="bookingSearch" class="form-control form-control-sm" placeholder="Search by booking code, guest name..." style="width: 350px;">
            </div>
            <div class="table-responsive">
              <table class="table table-hover table-sm align-middle">
                <thead class="table-light">
                  <tr>
                    <th>Booking Code</th>
                    <th>Guest Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Room</th>
                    <th>Check In</th>
                    <th>Check Out</th>
                    <th>Guests</th>
                    <th>Status</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="bookingsTableBody">
                </tbody>
              </table>
            </div>
          </div>
        </main>
      </div>
    </div>

    <div class="modal fade" id="bookingModal" tabindex="-1">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="bookingModalTitle">View Booking</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <form id="bookingModalForm">
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">Booking Code</label>
                  <input type="text" class="form-control" id="modalBookingCode" readonly>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Guest Name</label>
                  <input type="text" class="form-control" id="modalGuestName">
                </div>
                <div class="col-md-6">
                  <label class="form-label">Email</label>
                  <input type="email" class="form-control" id="modalGuestEmail">
                </div>
                <div class="col-md-6">
                  <label class="form-label">Phone</label>
                  <input type="text" class="form-control" id="modalGuestPhone">
                </div>
                <div class="col-md-6">
                  <label class="form-label">Room</label>
                  <input type="text" class="form-control" id="modalRoomName">
                </div>
                <div class="col-md-6">
                  <label class="form-label">Room Type</label>
                  <input type="text" class="form-control" id="modalRoomType">
                </div>
                <div class="col-md-6">
                  <label class="form-label">Status</label>
                  <select class="form-select" id="modalBookingStatus">
                    <option value="Pending">Pending</option>
                    <option value="Confirmed">Confirmed</option>
                    <option value="Cancelled">Cancelled</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Check In</label>
                  <input type="date" class="form-control" id="modalCheckin">
                </div>
                <div class="col-md-6">
                  <label class="form-label">Check Out</label>
                  <input type="date" class="form-control" id="modalCheckout">
                </div>
                <div class="col-md-4">
                  <label class="form-label">Adults</label>
                  <input type="number" class="form-control" id="modalAdults" min="0">
                </div>
                <div class="col-md-4">
                  <label class="form-label">Children</label>
                  <input type="number" class="form-control" id="modalChildren" min="0">
                </div>
                <div class="col-md-4">
                  <label class="form-label">Infants</label>
                  <input type="number" class="form-control" id="modalInfants" min="0">
                </div>
                <div class="col-md-4">
                  <label class="form-label">Pets</label>
                  <input type="number" class="form-control" id="modalPets" min="0">
                </div>
                <div class="col-md-4">
                  <label class="form-label">Service Animal</label>
                  <input type="text" class="form-control" id="modalServiceAnimal">
                </div>
                <div class="col-md-4">
                  <label class="form-label">Amount</label>
                  <input type="number" class="form-control" id="modalAmount" step="0.01">
                </div>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            <button type="button" class="btn btn-success" id="saveBookingBtn">Save Changes</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      function initBookingsPage() {
        const ADMIN_BOOKINGS_KEY = 'dredsAdminBookings';
        const defaultBookings = [];

        let bookings = [];
        const stored = localStorage.getItem(ADMIN_BOOKINGS_KEY);
        if (stored) {
          try {
            bookings = JSON.parse(stored);
          } catch (error) {
            bookings = defaultBookings;
          }
        }
        if (!bookings || !bookings.length) {
          bookings = defaultBookings.slice();
          localStorage.setItem(ADMIN_BOOKINGS_KEY, JSON.stringify(bookings));
        }

        const tbody = document.getElementById('bookingsTableBody');
        const bookingSearch = document.getElementById('bookingSearch');
        const bookingStatusFilter = document.getElementById('bookingStatusFilter');
        const bookingModal = new bootstrap.Modal(document.getElementById('bookingModal'));
        const modalTitle = document.getElementById('bookingModalTitle');
        const modalForm = document.getElementById('bookingModalForm');
        const modalBookingCode = document.getElementById('modalBookingCode');
        const adminNotificationArea = document.getElementById('adminNotificationArea');
        const modalGuestName = document.getElementById('modalGuestName');
        const modalGuestEmail = document.getElementById('modalGuestEmail');
        const modalGuestPhone = document.getElementById('modalGuestPhone');
        const modalRoomName = document.getElementById('modalRoomName');
        const modalRoomType = document.getElementById('modalRoomType');
        const modalBookingStatus = document.getElementById('modalBookingStatus');
        const modalCheckin = document.getElementById('modalCheckin');
        const modalCheckout = document.getElementById('modalCheckout');
        const modalAdults = document.getElementById('modalAdults');
        const modalChildren = document.getElementById('modalChildren');
        const modalInfants = document.getElementById('modalInfants');
        const modalPets = document.getElementById('modalPets');
        const modalServiceAnimal = document.getElementById('modalServiceAnimal');
        const modalAmount = document.getElementById('modalAmount');
        const saveBookingBtn = document.getElementById('saveBookingBtn');

        let activeBookingIndex = null;
        let modalMode = 'view';

        const saveBookings = () => {
          localStorage.setItem(ADMIN_BOOKINGS_KEY, JSON.stringify(bookings));
        };

        const getAdminNotifications = () => {
          try {
            return JSON.parse(localStorage.getItem('dredsAdminNotifications') || '[]');
          } catch (error) {
            return [];
          }
        };

        const saveAdminNotifications = (notifications) => {
          localStorage.setItem('dredsAdminNotifications', JSON.stringify(notifications));
        };

        const markAdminNotificationsRead = () => {
          const notifications = getAdminNotifications().map((notification) => ({ ...notification, read: true }));
          saveAdminNotifications(notifications);
          renderAdminNotifications();
        };

        const renderAdminNotifications = () => {
          if (!adminNotificationArea) return;
          const notifications = getAdminNotifications();
          if (!notifications.length) {
            adminNotificationArea.innerHTML = '';
            return;
          }

          const unreadCount = notifications.filter((notification) => !notification.read).length;
          const readCount = notifications.filter((notification) => notification.read).length;
          adminNotificationArea.innerHTML = `
            <div class="alert alert-info p-3">
              <div class="d-flex flex-column flex-md-row align-items-start justify-content-between gap-3 mb-2">
                <div>
                  <strong>${unreadCount > 0 ? `You have ${unreadCount} new notification${unreadCount === 1 ? '' : 's'}` : 'No new notifications'}</strong>
                  <div class="small text-secondary mt-1">Latest messages from customer booking activity.</div>
                </div>
                <div class="btn-group" style="display: flex; gap: 8px;">
                  <button type="button" class="btn btn-sm btn-outline-dark" id="markAllAdminNotificationsReadBtn">Mark all as read</button>
                  ${readCount > 0 ? `<button type="button" class="btn btn-sm btn-outline-danger" id="deleteAdminReadNotificationsBtn">Delete read</button>` : ''}
                </div>
              </div>
              <div class="notification-list">
                ${notifications.slice(-5).map((notification) => `
                  <div class="notification-item ${notification.read ? 'read' : 'unread'} mb-2 p-2 rounded bg-white border">
                    <div class="fw-semibold">${notification.message}</div>
                    <div class="small text-muted">${new Date(notification.createdAt || Date.now()).toLocaleString()}</div>
                  </div>
                `).join('')}
              </div>
            </div>
          `;
          adminNotificationArea.querySelector('#markAllAdminNotificationsReadBtn')?.addEventListener('click', markAdminNotificationsRead);
          adminNotificationArea.querySelector('#deleteAdminReadNotificationsBtn')?.addEventListener('click', () => {
            const notifications = getAdminNotifications().filter((notification) => !notification.read);
            saveAdminNotifications(notifications);
            renderAdminNotifications();
          });
        };

        const showAdminStatusMessage = (message, type = 'success') => {
          if (!adminNotificationArea) return;
          const element = document.createElement('div');
          element.className = `alert alert-${type} mb-2`;
          element.textContent = message;
          adminNotificationArea.prepend(element);
          setTimeout(() => {
            if (element.parentNode) element.parentNode.removeChild(element);
          }, 5000);
        };

        const statusBadge = (status) => {
          const badges = {
            Pending: 'badge-new',
            Confirmed: 'badge-confirmed',
            Cancelled: 'badge-cancel'
          };
          return `<span class="badge-status ${badges[status]}">${status}</span>`;
        };

        const render = (data) => {
          if (!tbody) return;
          tbody.innerHTML = data.length ? data.map((b) => `
            <tr>
              <td><strong>${b.id || b.code}</strong></td>
              <td>${b.customer || b.guest}</td>
              <td>${b.customerEmail || ''}</td>
              <td>${b.phone || ''}</td>
              <td>${b.room || ''}</td>
              <td>${b.checkin || ''}</td>
              <td>${b.checkout || ''}</td>
              <td>${b.guests || `${b.adults || 0} adults`}</td>
              <td>${statusBadge(b.status)}</td>
              <td>
                <button class="btn btn-sm btn-outline-primary me-1" type="button" onclick="window.viewBooking('${b.id || b.code}')">View</button>
                ${b.status === 'Pending' ? `
                  <button class="btn btn-sm btn-success me-1" type="button" onclick="window.acceptBooking('${b.id || b.code}')"><i class="fa fa-check me-1"></i>Approve</button>
                  <button class="btn btn-sm btn-danger" type="button" onclick="window.cancelBooking('${b.id || b.code}')"><i class="fa fa-times me-1"></i>Cancel</button>
                ` : `
                  <button class="btn btn-sm btn-outline-success me-1" type="button" onclick="window.editBooking('${b.id || b.code}')">Edit</button>
                  <button class="btn btn-sm btn-outline-danger" type="button" onclick="window.deleteBooking('${b.id || b.code}')">Delete</button>
                `}
              </td>
            </tr>
          `).join('') : '<tr><td colspan="10" class="text-center text-muted">No matching bookings found.</td></tr>';
        };

        const getFilteredBookings = () => {
          const filterText = bookingSearch.value.trim().toLowerCase();
          const status = bookingStatusFilter.value;
          return bookings.filter((b) => {
            const matchesText = Object.values(b).join(' ').toLowerCase().includes(filterText);
            const matchesStatus = status === 'All' || b.status === status;
            return matchesText && matchesStatus;
          });
        };

        const openModal = (mode, index) => {
          modalMode = mode;
          activeBookingIndex = index;
          let booking = null;
          if (mode === 'create') {
            // default empty booking for creation
            booking = {
              id: '', customer: '', customerEmail: '', phone: '', room: '', roomType: '', checkin: '', checkout: '', adults: 0, children: 0, infants: 0, pets: 0, serviceAnimal: 'No', amount: 0, status: 'Pending'
            };
          } else {
            booking = bookings[index];
            if (!booking) return;
          }

          modalTitle.textContent = mode === 'view' ? 'View Booking' : (mode === 'create' ? 'Create Booking' : 'Edit Booking');
          modalBookingCode.value = booking.id || booking.code || '';
          modalGuestName.value = booking.customer || booking.guest || '';
          modalGuestEmail.value = booking.customerEmail || '';
          modalGuestPhone.value = booking.phone || '';
          modalRoomName.value = booking.room || '';
          modalRoomType.value = booking.roomType || '';
          modalBookingStatus.value = booking.status || 'Pending';
          modalCheckin.value = booking.checkin || '';
          modalCheckout.value = booking.checkout || '';
          modalAdults.value = booking.adults || 0;
          modalChildren.value = booking.children || 0;
          modalInfants.value = booking.infants || 0;
          modalPets.value = booking.pets || 0;
          modalServiceAnimal.value = booking.serviceAnimal || '';
          modalAmount.value = booking.amount || '';
          const readOnly = mode === 'view';
          [modalGuestName, modalGuestEmail, modalGuestPhone, modalRoomName, modalRoomType, modalBookingStatus, modalCheckin, modalCheckout, modalAdults, modalChildren, modalInfants, modalPets, modalServiceAnimal, modalAmount].forEach((field) => {
            if (!field) return;
            if (field.tagName === 'SELECT') {
              field.disabled = readOnly;
            } else {
              field.readOnly = readOnly;
            }
          });
          // show save button for create/edit
          saveBookingBtn.style.display = mode === 'view' ? 'none' : 'inline-block';
          bookingModal.show();
        };

        const findBookingIndex = (code) => bookings.findIndex((booking) => booking.code === code || booking.id === code);

        window.viewBooking = (code) => {
          const index = findBookingIndex(code);
          if (index === -1) return;
          openModal('view', index);
        };

        window.editBooking = (code) => {
          const index = findBookingIndex(code);
          if (index === -1) return;
          openModal('edit', index);
        };

        window.deleteBooking = (code) => {
          const index = findBookingIndex(code);
          if (index === -1) return;
          if (!confirm(`Delete booking ${code}? This cannot be undone.`)) return;
          bookings.splice(index, 1);
          saveBookings();
          render(getFilteredBookings());
        };

        window.acceptBooking = (code) => {
          const index = findBookingIndex(code);
          if (index === -1) return;
          if (!confirm(`Approve booking ${code}?`)) return;
          bookings[index].status = 'Confirmed';
          saveBookings();
          render(getFilteredBookings());
          // notify customer that booking is confirmed
          try {
            const custList = JSON.parse(localStorage.getItem('dredsCustomerNotifications') || '[]');
            custList.push({ id: `CN-${Date.now()}`, email: (bookings[index].customerEmail || '').toLowerCase(), message: `Your booking ${code} has been confirmed. Please pay via GCash 09918500322 and send the receipt to our Facebook page: https://www.facebook.com/Dredtransienthouse`, read: false, createdAt: Date.now(), bookingId: code });
            localStorage.setItem('dredsCustomerNotifications', JSON.stringify(custList));
          } catch (e) { /* ignore */ }

          showAdminStatusMessage(`Booking ${code} has been approved.`, 'success');
        };

        // Open create booking modal
        document.getElementById('addBookingBtn')?.addEventListener('click', () => {
          openModal('create', null);
        });

        window.cancelBooking = (code) => {
          const index = findBookingIndex(code);
          if (index === -1) return;
          if (!confirm(`Cancel booking ${code}?`)) return;
          bookings[index].status = 'Cancelled';
          saveBookings();
          render(getFilteredBookings());
          showAdminStatusMessage(`Booking ${code} has been cancelled.`, 'warning');
        };

        saveBookingBtn.addEventListener('click', () => {
          if (modalMode === 'edit' && activeBookingIndex !== null) {
            bookings[activeBookingIndex] = {
              id: modalBookingCode.value || bookings[activeBookingIndex].id,
              customer: modalGuestName.value.trim(),
              customerEmail: modalGuestEmail.value.trim(),
              phone: modalGuestPhone.value.trim(),
              room: modalRoomName.value.trim(),
              roomType: modalRoomType.value.trim(),
              checkin: modalCheckin.value,
              checkout: modalCheckout.value,
              adults: Number(modalAdults.value) || 0,
              children: Number(modalChildren.value) || 0,
              infants: Number(modalInfants.value) || 0,
              pets: Number(modalPets.value) || 0,
              serviceAnimal: modalServiceAnimal.value.trim(),
              guests: `${Number(modalAdults.value) || 0} adults, ${Number(modalChildren.value) || 0} children, ${Number(modalInfants.value) || 0} infants, ${Number(modalPets.value) || 0} pets`,
              amount: parseFloat(modalAmount.value) || 0,
              status: modalBookingStatus.value
            };
            saveBookings();
            render(getFilteredBookings());
            bookingModal.hide();
            showAdminStatusMessage('Booking updated successfully.', 'success');
            return;
          }

          if (modalMode === 'create') {
            // generate a unique booking id
            const newId = `BK-${Math.floor(Math.random() * 900000 + 100000)}`;
            const newBooking = {
              id: newId,
              customer: modalGuestName.value.trim(),
              customerEmail: modalGuestEmail.value.trim(),
              phone: modalGuestPhone.value.trim(),
              room: modalRoomName.value.trim(),
              roomType: modalRoomType.value.trim(),
              checkin: modalCheckin.value,
              checkout: modalCheckout.value,
              adults: Number(modalAdults.value) || 0,
              children: Number(modalChildren.value) || 0,
              infants: Number(modalInfants.value) || 0,
              pets: Number(modalPets.value) || 0,
              serviceAnimal: modalServiceAnimal.value.trim(),
              guests: `${Number(modalAdults.value) || 0} adults, ${Number(modalChildren.value) || 0} children, ${Number(modalInfants.value) || 0} infants, ${Number(modalPets.value) || 0} pets`,
              amount: parseFloat(modalAmount.value) || 0,
              status: modalBookingStatus.value || 'Pending'
            };
            bookings.push(newBooking);
            saveBookings();
            render(getFilteredBookings());
            bookingModal.hide();
            showAdminStatusMessage(`Booking ${newBooking.id} has been created.`, 'success');
            return;
          }
        });

        bookingSearch.addEventListener('input', () => render(getFilteredBookings()));
        bookingStatusFilter.addEventListener('change', () => render(getFilteredBookings()));

        render(getFilteredBookings());
        renderAdminNotifications();

        // Refresh bookings and admin notification UI when localStorage changes in another tab (e.g., customer created booking)
        window.addEventListener('storage', (e) => {
          if (e.key === ADMIN_BOOKINGS_KEY) {
            try {
              bookings = JSON.parse(localStorage.getItem(ADMIN_BOOKINGS_KEY)) || bookings;
            } catch (err) {
              // ignore parse errors
            }
            render(getFilteredBookings());
          }
          if (e.key === 'dredsAdminNotifications') {
            renderAdminNotifications();
          }
        });

        document.getElementById('toggleSidebar')?.addEventListener('click', () => {
          document.getElementById('sidebar').classList.toggle('open');
        });

        document.getElementById('logoutBtn')?.addEventListener('click', () => {
          localStorage.removeItem('adminAuth');
          localStorage.removeItem('adminUser');
          location.replace('../index.html');
        });

        document.getElementById('logoutMenu')?.addEventListener('click', () => {
          localStorage.removeItem('adminAuth');
          localStorage.removeItem('adminUser');
          location.replace('../index.html');
        });

        if (localStorage.getItem('adminAuth') !== 'true') {
          location.replace('login.html');
        }
      }

      document.addEventListener('DOMContentLoaded', initBookingsPage);
    </script>
  </body>
</html>
